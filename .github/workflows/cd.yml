name: React CD

on:
  workflow_run:
    workflows: ['React CI']
    types: [completed]
    branches: ['develop']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Build
        run: npm run build

      - name: 학교 서버 SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout develop
            git pull origin develop
            docker compose down
            docker compose up -d --build
            docker compose ps

      - name: FEESH_FRONT CD Discord Notification (success)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_FRONT_WEBHOOK }}
          status: ${{ job.status }}
          title: '✅ 성공 ✅'
          description: '배포 성공'
          color: 65280
          username: 'FEESH-FRONT-bot'

      - name: FEESH_FRONT CD Discord Notification (failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_FRONT_WEBHOOK }}
          status: ${{ job.status }}
          title: '❗️ 실패 ❗️'
          description: '배포 실패'
          color: 16711680
          username: 'FEESH-FRONT-bot' 